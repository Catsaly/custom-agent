services:
  # FastAPI Backend — Free tier (sleeps after 15 min inactivity)
  - type: web
    name: milli-yapay-zeka-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ZHIPUAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEBUG
        value: "false"
    healthCheckPath: /health

  # Streamlit Frontend — Free tier
  - type: web
    name: milli-yapay-zeka-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      streamlit run app/streamlit_app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    envVars:
      - key: FASTAPI_URL
        fromService:
          name: milli-yapay-zeka-api
          type: web
          property: host
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ZHIPUAI_API_KEY
        sync: false
